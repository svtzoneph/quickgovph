<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuickGov PH – Resident Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0faf8; --card: #ffffff; --text: #0d2b27; --muted: #6b9e98;
    --accent: #0fbfa8; --accent-dark: #0d8c7d; --border: #d0ede9; --shadow: 0 8px 32px rgba(13,79,71,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; padding: 20px;}
  
  .auth-container { background: var(--card); width: 100%; max-width: 480px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; position: relative;}
  
  .auth-header { padding: 32px 32px 20px; text-align: center; border-bottom: 1px solid var(--border); background: #f8fdfb;}
  .auth-header img { height: 40px; margin-bottom: 16px; object-fit: contain;}
  .auth-header h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .auth-header p { font-size: 13px; color: var(--muted); font-weight: 500; }

  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); background: #f8fdfb;}
  .auth-tab { flex: 1; text-align: center; padding: 14px; font-size: 13px; font-weight: 800; color: var(--muted); cursor: pointer; transition: 0.2s; background: transparent; border: none; outline: none; border-bottom: 3px solid transparent;}
  .auth-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); background: var(--card);}

  .auth-body { padding: 32px; }
  .form-section { display: none; }
  .form-section.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .field { margin-bottom: 16px; position: relative;}
  .field label { display: block; font-size: 11px; font-weight: 800; color: var(--text); text-transform: uppercase; margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text); outline: none; transition: 0.2s; appearance: none; }
  .field input:focus, .field select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(15,191,168,0.1); }
  .field select:disabled { opacity: 0.6; cursor: not-allowed; }
  
  .forgot-link { position: absolute; right: 0; top: 0; font-size: 11px; font-weight: 700; color: var(--accent-dark); text-decoration: none; cursor: pointer; }
  .forgot-link:hover { text-decoration: underline; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .submit-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 10px;}
  .submit-btn:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,191,168,0.2); }
  .submit-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }

  .loader-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 10; display: none; align-items: center; justify-content: center; flex-direction: column; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(15,191,168,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;}
  @keyframes spin { to { transform: rotate(360deg); } }

  .admin-link { display: block; text-align: center; margin-top: 20px; font-size: 12px; font-weight: 700; color: var(--muted); text-decoration: none; transition: 0.2s; }
  .admin-link:hover { color: var(--accent-dark); }
</style>
</head>
<body>

<div class="auth-container">
  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div style="font-size: 12px; font-weight: 700; color: var(--accent-dark);" id="loader-text">Processing...</div>
  </div>

  <div class="auth-header">
    <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="QuickGov Logo">
    <h1>Resident Portal</h1>
    <p>Access your local government services</p>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
    <button class="auth-tab" onclick="switchTab('register')">Register</button>
  </div>

  <div class="auth-body">
    <div id="login-form" class="form-section active">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="logEmail" placeholder="Enter your email">
      </div>
      <div class="field">
        <label>Password</label>
        <a onclick="forgotPassword()" class="forgot-link">Forgot Password?</a>
        <input type="password" id="logPass" placeholder="Enter your password">
      </div>
      <button class="submit-btn" onclick="loginResident()">Sign In</button>
      <a href="admin/login.html" class="admin-link">Are you an Admin? Login here →</a>
    </div>

    <div id="register-form" class="form-section">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Juan Dela Cruz">
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="juan@example.com">
      </div>
      
      <div class="grid-2">
        <div class="field">
          <label>Province / Region</label>
          <select id="regProv" onchange="loadMunicipalities()">
            <option value="" disabled selected>Loading Provinces...</option>
          </select>
        </div>
        <div class="field">
          <label>City / Municipality</label>
          <select id="regMun" onchange="loadBarangays()" disabled>
            <option value="" disabled selected>Select Province First</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Barangay</label>
        <select id="regBrgy" disabled>
          <option value="" disabled selected>Select Municipality First</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Create password">
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="regPassConfirm" placeholder="Verify password">
        </div>
      </div>
      <button class="submit-btn" onclick="registerResident()">Create Account</button>
    </div>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.getElementById('login-form').classList.toggle('active', tab === 'login');
    document.getElementById('register-form').classList.toggle('active', tab === 'register');
    document.querySelectorAll('.auth-tab')[0].classList.toggle('active', tab === 'login');
    document.querySelectorAll('.auth-tab')[1].classList.toggle('active', tab === 'register');
  }

  // --- PHILIPPINE LOCATION API (PSGC) ---
  document.addEventListener("DOMContentLoaded", () => {
    loadProvinces();
  });

  async function loadProvinces() {
    const provSelect = document.getElementById('regProv');
    try {
      const response = await fetch('https://psgc.gitlab.io/api/provinces');
      const provinces = await response.json();
      
      provinces.push({ code: "NCR", name: "Metro Manila (NCR)" });
      provinces.sort((a, b) => a.name.localeCompare(b.name));

      provSelect.innerHTML = '<option value="" disabled selected>Select Province...</option>';
      provinces.forEach(prov => {
        provSelect.innerHTML += `<option value="${prov.code}">${prov.name}</option>`;
      });
    } catch (error) {
      provSelect.innerHTML = '<option value="" disabled selected>Error loading API</option>';
    }
  }

  async function loadMunicipalities() {
    const provCode = document.getElementById('regProv').value;
    const munSelect = document.getElementById('regMun');
    const brgySelect = document.getElementById('regBrgy');

    munSelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
    munSelect.disabled = true;
    brgySelect.innerHTML = '<option value="" disabled selected>Select Municipality First</option>';
    brgySelect.disabled = true;

    try {
      const url = provCode === "NCR" 
        ? `https://psgc.gitlab.io/api/regions/130000000/cities-municipalities`
        : `https://psgc.gitlab.io/api/provinces/${provCode}/cities-municipalities`;

      const response = await fetch(url);
      const municipalities = await response.json();
      municipalities.sort((a, b) => a.name.localeCompare(b.name));

      munSelect.innerHTML = '<option value="" disabled selected>Select City/Mun...</option>';
      municipalities.forEach(mun => {
        munSelect.innerHTML += `<option value="${mun.code}">${mun.name}</option>`;
      });
      munSelect.disabled = false;
    } catch (error) {
      munSelect.innerHTML = '<option value="" disabled selected>Error loading API</option>';
    }
  }

  async function loadBarangays() {
    const munCode = document.getElementById('regMun').value;
    const brgySelect = document.getElementById('regBrgy');

    brgySelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
    brgySelect.disabled = true;

    try {
      const response = await fetch(`https://psgc.gitlab.io/api/cities-municipalities/${munCode}/barangays`);
      const barangays = await response.json();
      barangays.sort((a, b) => a.name.localeCompare(b.name));

      brgySelect.innerHTML = '<option value="" disabled selected>Select Barangay...</option>';
      barangays.forEach(brgy => {
        brgySelect.innerHTML += `<option value="${brgy.code}">${brgy.name}</option>`;
      });
      brgySelect.disabled = false;
    } catch (error) {
      brgySelect.innerHTML = '<option value="" disabled selected>Error loading API</option>';
    }
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyB12w_rz613qgUI1G9N0JeHpkqs5FC1T-g", authDomain: "quickgov-ph.firebaseapp.com", databaseURL: "https://quickgov-ph-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "quickgov-ph", storageBucket: "quickgov-ph.firebasestorage.app", messagingSenderId: "370121513915", appId: "1:370121513915:web:a9cad3a4af0f18a063429e" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  function showLoader(msg) {
    document.getElementById('loader').style.display = 'flex';
    document.getElementById('loader-text').innerText = msg;
  }
  function hideLoader() { document.getElementById('loader').style.display = 'none'; }

  // Forgot Password Function
  window.forgotPassword = async () => {
    const email = document.getElementById('logEmail').value;
    if(!email) return alert("Please enter your email address in the field first to reset your password.");
    
    showLoader("Sending Reset Link...");
    try {
      await sendPasswordResetEmail(auth, email);
      hideLoader();
      alert("Password reset link sent! Please check your email inbox or spam folder.");
    } catch(err) {
      hideLoader();
      alert("Error: " + err.message);
    }
  };

  // Login Verification and Logic
  window.loginResident = async () => {
    const e = document.getElementById('logEmail').value;
    const p = document.getElementById('logPass').value;
    if(!e || !p) return alert("Please fill all fields.");
    
    showLoader("Signing In...");
    try {
      const userCred = await signInWithEmailAndPassword(auth, e, p);
      const user = userCred.user;

      // 1. Check if Email is Verified
      if (!user.emailVerified) {
        hideLoader();
        await signOut(auth);
        return alert("Your email is not verified yet. Please check your inbox for the verification link.");
      }

      // 2. Check Admin Approval Status
      const snapshot = await get(child(ref(db), `users/${user.uid}`));
      if (snapshot.exists()) {
        const userData = snapshot.val();
        if (userData.status === "approved") {
          window.location.href = "dashboard.html"; // Fully Approved
        } else {
          hideLoader();
          await signOut(auth);
          alert("Your account is verified but still waiting for Admin approval. Please check back later.");
        }
      } else {
        hideLoader();
        await signOut(auth);
        alert("Account records not found.");
      }
    } catch(err) {
      hideLoader();
      alert("Error: " + err.message);
    }
  };

  window.registerResident = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;
    const passConfirm = document.getElementById('regPassConfirm').value;
    
    const provSelect = document.getElementById('regProv');
    const munSelect = document.getElementById('regMun');
    const brgySelect = document.getElementById('regBrgy');

    // --- VALIDATIONS ---
    if(!name || !email || !pass || !passConfirm || provSelect.value === "" || munSelect.value === "" || brgySelect.value === "") {
      return alert("Please fill out all fields and select your complete location.");
    }

    const nameRegex = /^[a-zA-ZñÑ\s\-\.]+$/;
    if (!nameRegex.test(name)) return alert("Name cannot contain numbers or special characters.");

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) return alert("Please enter a valid email address.");

    if (pass !== passConfirm) return alert("Passwords do not match! Please verify your password.");

    // Get the actual names of the locations
    const provName = provSelect.options[provSelect.selectedIndex].text;
    const munName = munSelect.options[munSelect.selectedIndex].text;
    const brgyName = brgySelect.options[brgySelect.selectedIndex].text;

    showLoader("Creating Account...");
    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, pass);
      
      // SEND EMAIL VERIFICATION
      await sendEmailVerification(userCred.user);

      const fullAddress = `${brgyName}, ${munName}, ${provName}`;
      
      const userData = {
        fullName: name,
        email: email,
        province: provName,
        municipality: munName,
        barangay: brgyName,
        address: fullAddress,
        role: "resident",
        status: "pending", 
        authMethod: "email_password",
        createdAt: Date.now()
      };

      // MULTI-PATH UPDATE (Save to both locations for organized Database View)
      const updates = {};
      updates[`users/${userCred.user.uid}`] = userData;
      updates[`directory/${provName}/${munName}/${brgyName}/${userCred.user.uid}`] = userData;

      await update(ref(db), updates);

      hideLoader();
      alert("Registration successful! A verification link has been sent to your email. Please verify your email, then wait for your Admin to approve your account.");
      
      document.getElementById('regName').value = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('regPass').value = '';
      document.getElementById('regPassConfirm').value = '';
      await signOut(auth); 
      switchTab('login');
      
    } catch(err) {
      hideLoader();
      alert("Error: " + err.message);
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (user && window.location.pathname.includes('index.html')) {
        const snapshot = await get(child(ref(db), `users/${user.uid}`));
        if (snapshot.exists()) {
          const userData = snapshot.val();
          if (userData.status === "approved" && user.emailVerified) {
            window.location.href = "dashboard.html";
          } else {
            await signOut(auth);
          }
        }
    }
  });
</script>
</body>
</html>
