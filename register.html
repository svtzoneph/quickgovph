<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuickGov PH – Resident Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/register.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="QuickGov Logo">
    </div>
    <div class="nav-buttons">
      <a href="index" class="btn btn-outline">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Home
      </a>
    </div>
  </nav>

  <main class="register-wrapper">
    <div class="auth-container">
      <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 13px; font-weight: 800; color: var(--accent-dark);" id="loader-text">Processing...</div>
      </div>

      <div class="auth-header">
        <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="QuickGov Logo">
        <h1>Create an Account</h1>
        <p>Register as a verified resident</p>
      </div>

      <div class="auth-body">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Juan Dela Cruz">
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="juan@example.com">
        </div>
        
        <div class="grid-2">
          <div class="field">
            <label>Province / Region</label>
            <select id="regProv" onchange="loadMunicipalities()">
              <option value="" disabled selected>Loading...</option>
            </select>
          </div>
          <div class="field">
            <label>City / Municipality</label>
            <select id="regMun" onchange="loadBarangays()" disabled>
              <option value="" disabled selected>Select Province First</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Barangay</label>
          <select id="regBrgy" disabled>
            <option value="" disabled selected>Select Municipality First</option>
          </select>
        </div>

        <div class="grid-2">
          <div class="field">
            <label>Password</label>
            <input type="password" id="regPass" placeholder="Create password">
          </div>
          <div class="field">
            <label>Confirm Password</label>
            <input type="password" id="regPassConfirm" placeholder="Verify password">
          </div>
        </div>

        <button class="submit-btn" onclick="registerResident()">Register Account</button>

        <div class="bottom-links">
          Already have an account? <a href="login">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="Logo">
    </div>
    <div class="footer-copyright">
        &copy; 2026 QUICKGOV PH. ALL RIGHTS RESERVED.
    </div>
  </footer>

  <script type="module" src="./js/register.js"></script>
</body>
</html>
