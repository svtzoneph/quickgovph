<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuickGov PH – Super Admin Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1a; --card: #2d2d2d; --text: #ffffff; --muted: #a0a0a0;
    --accent: #ffb84d; --accent-dark: #e69c24; --border: #404040; 
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;}
  
  .setup-container { background: var(--card); width: 100%; max-width: 600px; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; position: relative;}
  
  .header { padding: 30px; text-align: center; border-bottom: 1px solid var(--border); background: #222;}
  .header h1 { font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
  .header p { font-size: 13px; color: var(--muted); }

  .body { padding: 30px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: #1a1a1a; font-family: inherit; font-size: 14px; font-weight: 600; color: #fff; outline: none; transition: 0.2s; appearance: none; }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 184, 77, 0.2); }
  .field select:disabled { opacity: 0.5; cursor: not-allowed; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .highlight-box { padding: 16px; background: rgba(255, 184, 77, 0.1); border: 1px dashed var(--accent); border-radius: 12px; margin-bottom: 18px;}
  .highlight-box label { color: var(--accent); }

  .submit-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--accent); color: #1a1a1a; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 10px;}
  .submit-btn:hover { background: var(--accent-dark); transform: translateY(-2px); }

  .loader-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26,26,26,0.9); z-index: 10; display: none; align-items: center; justify-content: center; flex-direction: column; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,184,77,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;}
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .success-text { font-size: 12px; color: #34a853; text-align: center; margin-top: 16px; font-weight: 600; display: none;}
</style>
</head>
<body>

<div class="setup-container">
  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div style="font-size: 12px; font-weight: 700; color: var(--accent);" id="loader-text">Deploying Admin...</div>
  </div>

  <div class="header">
    <h1>Super Admin Dashboard</h1>
    <p>Create Official Accounts for LGU / Barangay Admins</p>
  </div>

  <div class="body">
    <div class="grid-2">
      <div class="field">
        <label>Admin Full Name / Title</label>
        <input type="text" id="regName" placeholder="e.g. Brgy. Sec. Dela Cruz">
      </div>
      <div class="field">
        <label>Official Email</label>
        <input type="email" id="regEmail" placeholder="admin@brgy.gov.ph">
      </div>
    </div>

    <div class="highlight-box">
      <div class="field" style="margin-bottom: 0;">
        <label>Admin Jurisdiction Level</label>
        <select id="regLevel" onchange="toggleJurisdiction()">
          <option value="" disabled selected>Select Level...</option>
          <option value="municipal">City Hall / Municipal Admin (Sees all barangays)</option>
          <option value="barangay">Barangay Admin (Sees only specific barangay)</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Province / Region</label>
        <select id="regProv" onchange="loadMunicipalities()">
          <option value="" disabled selected>Loading Provinces...</option>
        </select>
      </div>
      <div class="field">
        <label>City / Municipality</label>
        <select id="regMun" onchange="loadBarangays()" disabled>
          <option value="" disabled selected>Select Province First</option>
        </select>
      </div>
    </div>
    
    <div class="field" id="brgyField" style="display: none;">
      <label>Assigned Barangay</label>
      <select id="regBrgy">
        <option value="" disabled selected>Select Municipality First</option>
      </select>
    </div>

    <div class="field">
      <label>Initial Password</label>
      <input type="text" id="regPass" placeholder="Set a secure password">
    </div>

    <button class="submit-btn" onclick="registerAdmin()">Deploy Admin Account</button>
    <div class="success-text" id="successMsg">Admin account successfully created and saved!</div>
  </div>
</div>

<script>
  // Dynamic form toggle
  function toggleJurisdiction() {
    const level = document.getElementById('regLevel').value;
    const brgyField = document.getElementById('brgyField');
    if(level === 'barangay') {
      brgyField.style.display = 'block';
    } else {
      brgyField.style.display = 'none';
      document.getElementById('regBrgy').value = '';
    }
  }

  // --- PHILIPPINE LOCATION API (PSGC) ---
  document.addEventListener("DOMContentLoaded", () => { loadProvinces(); });

  async function loadProvinces() {
    const provSelect = document.getElementById('regProv');
    try {
      const response = await fetch('https://psgc.gitlab.io/api/provinces');
      const provinces = await response.json();
      provinces.push({ code: "NCR", name: "Metro Manila (NCR)" });
      provinces.sort((a, b) => a.name.localeCompare(b.name));

      provSelect.innerHTML = '<option value="" disabled selected>Select Province...</option>';
      provinces.forEach(prov => { provSelect.innerHTML += `<option value="${prov.code}">${prov.name}</option>`; });
    } catch (error) { provSelect.innerHTML = '<option value="" disabled selected>Error loading API</option>'; }
  }

  async function loadMunicipalities() {
    const provCode = document.getElementById('regProv').value;
    const munSelect = document.getElementById('regMun');
    munSelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
    munSelect.disabled = true;

    try {
      const url = provCode === "NCR" 
        ? `https://psgc.gitlab.io/api/regions/130000000/cities-municipalities`
        : `https://psgc.gitlab.io/api/provinces/${provCode}/cities-municipalities`;

      const response = await fetch(url);
      const municipalities = await response.json();
      municipalities.sort((a, b) => a.name.localeCompare(b.name));

      munSelect.innerHTML = '<option value="" disabled selected>Select City/Mun...</option>';
      municipalities.forEach(mun => { munSelect.innerHTML += `<option value="${mun.code}">${mun.name}</option>`; });
      munSelect.disabled = false;
    } catch (error) {}
  }

  async function loadBarangays() {
    const munCode = document.getElementById('regMun').value;
    const brgySelect = document.getElementById('regBrgy');
    brgySelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
    brgySelect.disabled = true;

    try {
      const response = await fetch(`https://psgc.gitlab.io/api/cities-municipalities/${munCode}/barangays`);
      const barangays = await response.json();
      barangays.sort((a, b) => a.name.localeCompare(b.name));

      brgySelect.innerHTML = '<option value="" disabled selected>Select Barangay...</option>';
      barangays.forEach(brgy => { brgySelect.innerHTML += `<option value="${brgy.code}">${brgy.name}</option>`; });
      brgySelect.disabled = false;
    } catch (error) {}
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyB12w_rz613qgUI1G9N0JeHpkqs5FC1T-g", 
    authDomain: "quickgov-ph.firebaseapp.com", 
    databaseURL: "https://quickgov-ph-default-rtdb.asia-southeast1.firebasedatabase.app", 
    projectId: "quickgov-ph", 
    storageBucket: "quickgov-ph.firebasestorage.app", 
    messagingSenderId: "370121513915", 
    appId: "1:370121513915:web:a9cad3a4af0f18a063429e" 
  };
  
  // 1. Primary App (Your Current Session)
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 2. Secondary App (Strictly for creating users silently)
  // By initializing a second app with a unique name, auth states don't collide.
  const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
  const secondaryAuth = getAuth(secondaryApp);

  function showLoader(msg) {
    document.getElementById('loader').style.display = 'flex';
    document.getElementById('loader-text').innerText = msg;
  }
  function hideLoader() { document.getElementById('loader').style.display = 'none'; }

  window.registerAdmin = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;
    const level = document.getElementById('regLevel').value;
    
    const provSelect = document.getElementById('regProv');
    const munSelect = document.getElementById('regMun');
    const brgySelect = document.getElementById('regBrgy');

    if(!name || !email || !pass || !level || provSelect.value === "" || munSelect.value === "") {
      return alert("Please fill out all required fields.");
    }
    if(level === 'barangay' && brgySelect.value === "") {
      return alert("Please select the specific Barangay for this admin.");
    }

    const provName = provSelect.options[provSelect.selectedIndex].text;
    const munName = munSelect.options[munSelect.selectedIndex].text;
    const brgyName = level === 'barangay' ? brgySelect.options[brgySelect.selectedIndex].text : "ALL";

    showLoader("Deploying Admin Account to Database...");
    try {
      // Create user using the SECONDARY app, so your main app session remains untouched
      const userCred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
      
      const adminData = {
        fullName: name,
        email: email,
        role: "admin",
        adminLevel: level,
        province: provName,
        municipality: munName,
        barangay: brgyName,
        createdAt: Date.now()
      };

      // Save database record using primary app (so permissions work properly)
      await set(ref(db, `admins/${userCred.user.uid}`), adminData);

      // Sign out the secondary app immediately to clear memory
      await signOut(secondaryAuth);

      hideLoader();
      
      const successMsg = document.getElementById('successMsg');
      successMsg.style.display = 'block';
      setTimeout(() => { successMsg.style.display = 'none'; }, 5000);

      // Clear the form
      document.getElementById('regName').value = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('regPass').value = '';

    } catch(err) {
      hideLoader();
      alert("Error: " + err.message);
    }
  };
</script>
</body>
</html>
