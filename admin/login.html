<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuickGov PH – Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eafaf1; --card: #ffffff; --text: #0d2b27; --muted: #6b9e98;
    /* Admin specific dark green accent */
    --accent: #0d4f47; --accent-dark: #093832; --border: #d0ede9; --shadow: 0 8px 32px rgba(13,79,71,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; padding: 20px;}
  
  .auth-container { background: var(--card); width: 100%; max-width: 480px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; position: relative;}
  
  .auth-header { padding: 32px 32px 20px; text-align: center; border-bottom: 1px solid var(--border); background: #f8fdfb;}
  .auth-header img { height: 40px; margin-bottom: 16px; object-fit: contain;}
  .auth-header h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .auth-header p { font-size: 13px; color: var(--muted); font-weight: 500; }

  .auth-tabs { display: flex; border-bottom: 1px solid var(--border); background: #f8fdfb;}
  .auth-tab { flex: 1; text-align: center; padding: 14px; font-size: 13px; font-weight: 800; color: var(--muted); cursor: pointer; transition: 0.2s; background: transparent; border: none; outline: none; border-bottom: 3px solid transparent;}
  .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--card);}

  .auth-body { padding: 32px; }
  .form-section { display: none; }
  .form-section.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .field { margin-bottom: 16px; position: relative;}
  .field label { display: block; font-size: 11px; font-weight: 800; color: var(--text); text-transform: uppercase; margin-bottom: 6px; }
  .field input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text); outline: none; transition: 0.2s; appearance: none; }
  .field input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(13,79,71,0.1); }
  
  .forgot-link { position: absolute; right: 0; top: 0; font-size: 11px; font-weight: 700; color: var(--accent); text-decoration: none; cursor: pointer; }
  .forgot-link:hover { text-decoration: underline; }

  .submit-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 10px;}
  .submit-btn:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(13,79,71,0.2); }
  .submit-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }

  .loader-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 10; display: none; align-items: center; justify-content: center; flex-direction: column; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(13,79,71,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;}
  @keyframes spin { to { transform: rotate(360deg); } }

  .resident-link { display: block; text-align: center; margin-top: 20px; font-size: 12px; font-weight: 700; color: var(--muted); text-decoration: none; transition: 0.2s; }
  .resident-link:hover { color: var(--accent-dark); }
</style>
</head>
<body>

<div class="auth-container">
  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div style="font-size: 12px; font-weight: 700; color: var(--accent);" id="loader-text">Authenticating...</div>
  </div>

  <div class="auth-header">
    <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="QuickGov Logo">
    <h1>Admin Portal</h1>
    <p>Authorized Personnel Only</p>
  </div>

  <div class="auth-body">
    <div id="login-form" class="form-section active">
      <div class="field">
        <label>Admin Email</label>
        <input type="email" id="logEmail" placeholder="admin@quickgov.ph">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="logPass" placeholder="Enter your password">
      </div>
      <button class="submit-btn" onclick="loginAdmin()">Sign In</button>
      <a href="index.html" class="resident-link">← Back to Resident Portal</a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyB12w_rz613qgUI1G9N0JeHpkqs5FC1T-g", authDomain: "quickgov-ph.firebaseapp.com", databaseURL: "https://quickgov-ph-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "quickgov-ph", storageBucket: "quickgov-ph.firebasestorage.app", messagingSenderId: "370121513915", appId: "1:370121513915:web:a9cad3a4af0f18a063429e" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  function showLoader(msg) {
    document.getElementById('loader').style.display = 'flex';
    document.getElementById('loader-text').innerText = msg;
  }
  function hideLoader() { document.getElementById('loader').style.display = 'none'; }

  // Forgot Password Functionality for Admins
  window.forgotPassword = async () => {
    const email = document.getElementById('logEmail').value;
    if(!email) return alert("Please enter your admin email address first to reset your password.");
    
    showLoader("Sending Reset Link...");
    try {
      await sendPasswordResetEmail(auth, email);
      hideLoader();
      alert("Password reset link sent! Please check your official email inbox.");
    } catch(err) {
      hideLoader();
      alert("Error: " + err.message);
    }
  };

  // Login Authentication Check
  window.loginAdmin = async () => {
    const e = document.getElementById('logEmail').value;
    const p = document.getElementById('logPass').value;
    if(!e || !p) return alert("Please fill all fields");
    
    showLoader("Authenticating...");
    try {
      const userCred = await signInWithEmailAndPassword(auth, e, p);
      
      // Strict Check: Verify if user is registered inside the 'admins' database node
      const snapshot = await get(child(ref(db), `admins/${userCred.user.uid}`));
      if(snapshot.exists()) {
        window.location.href = "dashboard.html"; // Proceed to Admin Dashboard
      } else {
        // Kick out normal users trying to login here
        await signOut(auth);
        hideLoader();
        alert("Access Denied: This email does not have administrator privileges.");
      }
    } catch(err) {
      hideLoader();
      alert("Error: " + err.message);
    }
  };
</script>
</body>
</html>
