<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuickGov PH – Resident Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/login.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="QuickGov Logo">
    </div>
    <div class="nav-buttons">
      <a href="index" class="btn btn-outline">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Home
      </a>
    </div>
  </nav>

  <main class="login-wrapper">
    <div class="auth-container">
      <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 13px; font-weight: 800; color: var(--accent-dark);" id="loader-text">Checking session...</div>
      </div>

      <div class="auth-header">
        <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="QuickGov Logo">
        <h1>Resident Login</h1>
        <p>Sign in to access your local services</p>
      </div>

      <div class="auth-body">
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="logEmail" placeholder="Enter your email">
        </div>
        <div class="field">
          <label>Password</label>
          <a onclick="forgotPassword()" class="forgot-link">Forgot Password?</a>
          <input type="password" id="logPass" placeholder="Enter your password">
        </div>
        
        <button class="submit-btn" onclick="loginResident()">Sign In Securely</button>
        
        <div class="bottom-links">
          Don't have an account? <a href="register">Register here</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <img src="https://res.cloudinary.com/dlmnmuizk/image/upload/v1778322150/0f9ccf86-1759-49df-95ce-193834ff5090_gbvb9u.png" alt="Logo">
    </div>
    <div class="footer-copyright">
        &copy; 2026 QUICKGOV PH. ALL RIGHTS RESERVED.
    </div>
  </footer>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
